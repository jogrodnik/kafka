# Logical DR endpoint. In a real environment DNS/PSC points to the active site.
bootstrap.servers=kafka-dr.example.internal:9092

acks=all
enable.idempotence=true
retries=2147483647
delivery.timeout.ms=120000
request.timeout.ms=30000

# KIP-899 client recovery
metadata.recovery.strategy=rebootstrap
metadata.recovery.rebootstrap.trigger.ms=30000

# POC transport only
security.protocol=PLAINTEXT

# For a transactional producer, add a stable instance-specific transactional.id
# in the application, e.g. payments-producer-01.
# After cluster failover, create/reinitialize the producer against Cluster B;
# do not assume an in-flight transaction from A continues on B.
