# Local object on Cluster B, remote cluster is A.
# LOCAL_MIRROR is the important direction during normal A -> B active/passive DR.
bootstrap.servers=a-broker-1:9092,a-broker-2:9092,a-broker-3:9092
link.mode=BIDIRECTIONAL
consumer.offset.sync.enable=true
consumer.offset.group.filters={"groupFilters":[{"name":"*","patternType":"LITERAL","filterType":"INCLUDE","topicTypes":["LOCAL_MIRROR"]}]}
consumer.offset.sync.ms=5000
topic.config.sync.ms=5000
mirror.start.offset.spec=earliest
acl.sync.enable=false
