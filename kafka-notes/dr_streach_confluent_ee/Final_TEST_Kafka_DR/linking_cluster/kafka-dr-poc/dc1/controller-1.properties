# DC1 controller 1 - POC only
process.roles=controller
node.id=1

controller.quorum.voters=1@a-ctrl-1:9093,2@a-ctrl-2:9093,3@a-ctrl-3:9093
controller.listener.names=CONTROLLER
listeners=CONTROLLER://0.0.0.0:9093

inter.broker.listener.name=BROKER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT

log.dirs=/var/lib/kafka/controller-1
